org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=false
# Keep R fields final so existing Java switch(R.id...) / switch(attr) code compiles.
android.enableAppCompileTimeRClass=false
android.nonFinalResIds=false
# Keep classic android {} DSL while migrating this legacy Groovy project.
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
