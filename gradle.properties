# Force a JDK that can run Gradle 5.4.1 / AGP 3.5.
# User ~/.gradle/gradle.properties may set org.gradle.java.home to a newer
# Android Studio JBR; that property wins over project gradle.properties, so
# gradlew also passes -Dorg.gradle.java.home when it can discover JDK 8.
org.gradle.jvmargs=-Xmx2048m
